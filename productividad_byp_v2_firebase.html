/* ===================== CERROJO DE DISPOSITIVO =====================
   Pide un código la primera vez que la app se abre en un equipo nuevo.
   El código NO está escrito en este archivo: solo vive su huella (SHA-256
   con sal), de la que no se puede volver atrás para recuperarlo.
   Para cambiarlo hay que regenerar la huella. */
const CERROJO = {
  hash: '62f87d3128894b3f2ee09d6f7a52b3c2173d534696b2ab038f07ccedae5d0493',
  sal:  'prod-byp-2026-v3',
  gen:  1,              /* súbelo a 2, 3… para obligar a reactivar TODOS los equipos */
  dias: 0,       /* días que dura una activación; 0 = para siempre */
  clave:'bypf_disp',
  marca:'#0E2A66'
};

function sha256(msg){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const b=[]; for(let i=0;i<msg.length;i++){ let c=msg.codePointAt(i);
    if(c>0xFFFF) i++;
    if(c<128) b.push(c);
    else if(c<2048){ b.push(192|c>>6,128|c&63); }
    else if(c<65536){ b.push(224|c>>12,128|(c>>6)&63,128|c&63); }
    else { b.push(240|c>>18,128|(c>>12)&63,128|(c>>6)&63,128|c&63); } }
  const bits=b.length*8; b.push(0x80); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push(Math.floor(bits/Math.pow(2,i*8))&255);
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<b.length;i+=64){
    const w=new Array(64);
    for(let t=0;t<16;t++) w[t]=(b[i+t*4]<<24)|(b[i+t*4+1]<<16)|(b[i+t*4+2]<<8)|b[i+t*4+3];
    for(let t=16;t<64;t++){
      const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);
      const s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)|0; }
    let [a,bb,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[t]+w[t])|0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&bb)^(a&c)^(bb&c);
      const t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=bb; bb=a; a=(t1+t2)|0; }
    H=[(H[0]+a)|0,(H[1]+bb)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
const codigoOK = c => sha256(String(c||'').trim().toUpperCase()+CERROJO.sal) === CERROJO.hash;

/* --- identidad local del equipo --- */
function LS(k,v){
  try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); return v; }

}
function dispLeer(){ try{ return JSON.parse(LS(CERROJO.clave)||'null'); }catch(e){ return null; } }
function dispGuardar(d){ LS(CERROJO.clave, JSON.stringify(d)); }
function dispNuevoId(){
  try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'd-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function equipoProbable(){
  const u=navigator.userAgent, s=navigator.platform||'';
  const so = /Android/i.test(u)?'Android' : /iPhone|iPad|iPod/i.test(u)?'iPhone o iPad'
           : /Windows/i.test(u)?'Windows' : /Mac/i.test(u)?'Mac' : /Linux/i.test(u)?'Linux' : (s||'Equipo');
  const nav= /Edg\//.test(u)?'Edge' : /OPR\//.test(u)?'Opera' : /Chrome\//.test(u)?'Chrome'
           : /Firefox\//.test(u)?'Firefox' : /Safari\//.test(u)?'Safari' : 'Navegador';
  return so+' · '+nav;
}
function diasRestantes(d){
  if(!CERROJO.dias) return Infinity;
  return CERROJO.dias - Math.floor((Date.now()-d.desde)/86400000);
}
function dispVigente(){
  const d=dispLeer();
  if(!d || !d.id || d.gen!==CERROJO.gen) return null;
  if(diasRestantes(d)<=0) return null;
  return d;
}

function makeLocalDB(){
  const read=k=>{try{return JSON.parse(localStorage.getItem("bypf_"+k))}catch(e){return null}};
  const arr=k=>read(k)||[]; const write=(k,v)=>localStorage.setItem("bypf_"+k,JSON.stringify(v));
  if(!read("techs")) write("techs",TECNICOS_INICIALES);
  if(!read("settings")) write("settings",DEFAULTS);
  const subs={jobs:[],techs:[],orders:[],settings:[]};
  const emit=c=>subs[c].forEach(cb=>cb(c==="settings"?(read("settings")||DEFAULTS):arr(c)));
  return {mode:"local",
    onSettings(cb){subs.settings.push(cb);cb(read("settings")||DEFAULTS);},
    saveSettings(s){write("settings",s);emit("settings");},
    onTechs(cb){subs.techs.push(cb);cb(arr("techs"));},
    saveTech(t){const a=arr("techs");const i=a.findIndex(x=>x.id===t.id);i>=0?a[i]=t:a.push(t);write("techs",a);emit("techs");},
    delTech(id){write("techs",arr("techs").filter(x=>x.id!==id));emit("techs");},
    onOrders(cb){subs.orders.push(cb);cb(arr("orders"));},
    saveOrder(o){const a=arr("orders");const i=a.findIndex(x=>x.id===o.id);i>=0?a[i]=o:a.push(o);write("orders",a);emit("orders");},
    delOrder(id){write("orders",arr("orders").filter(x=>x.id!==id));emit("orders");},
    onJobs(cb){subs.jobs.push(cb);cb(arr("jobs"));},
    saveJob(j){const a=arr("jobs");const i=a.findIndex(x=>x.id===j.id);i>=0?a[i]=j:a.push(j);write("jobs",a);emit("jobs");},
    delJob(id){write("jobs",arr("jobs").filter(x=>x.id!==id));emit("jobs");},
    onDevices(cb){subs.devices=subs.devices||[];subs.devices.push(cb);cb(arr("devices"));},
    async getDevice(id){return arr("devices").find(x=>x.id===id)||null;},
    async saveDevice(d){const a=arr("devices");const i=a.findIndex(x=>x.id===d.id);i>=0?a[i]=d:a.push(d);write("devices",a);(subs.devices||[]).forEach(cb=>cb(a));},
    async delDevice(id){const a=arr("devices").filter(x=>x.id!==id);write("devices",a);(subs.devices||[]).forEach(cb=>cb(a));},
  };
}
async function makeCloudDB(){
  const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
  const fs=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
  const app=initializeApp(FIREBASE_CONFIG); const db=fs.getFirestore(app);
  const ts=await fs.getDocs(fs.collection(db,"techs"));
  if(ts.empty){for(const t of TECNICOS_INICIALES)await fs.setDoc(fs.doc(db,"techs",t.id),t);}
  const st=await fs.getDoc(fs.doc(db,"settings","main"));
  if(!st.exists())await fs.setDoc(fs.doc(db,"settings","main"),DEFAULTS);
  return {mode:"cloud",
    onSettings(cb){fs.onSnapshot(fs.doc(db,"settings","main"),d=>cb(d.data()||DEFAULTS));},
    saveSettings(s){fs.setDoc(fs.doc(db,"settings","main"),s);},
    onTechs(cb){fs.onSnapshot(fs.collection(db,"techs"),s=>cb(s.docs.map(d=>d.data())));},
    saveTech(t){fs.setDoc(fs.doc(db,"techs",t.id),t);},
    delTech(id){fs.deleteDoc(fs.doc(db,"techs",id));},
    onOrders(cb){fs.onSnapshot(fs.collection(db,"orders"),s=>cb(s.docs.map(d=>d.data())));},
    saveOrder(o){fs.setDoc(fs.doc(db,"orders",o.id),o);},
    delOrder(id){fs.deleteDoc(fs.doc(db,"orders",id));},
    onJobs(cb){fs.onSnapshot(fs.collection(db,"jobs"),s=>cb(s.docs.map(d=>d.data())));},
    saveJob(j){fs.setDoc(fs.doc(db,"jobs",j.id),j);},
    delJob(id){fs.deleteDoc(fs.doc(db,"jobs",id));},
    onDevices(cb){fs.onSnapshot(fs.collection(db,"devices"),s=>cb(s.docs.map(d=>d.data())));},
    async getDevice(id){const d=await fs.getDoc(fs.doc(db,"devices",id));return d.exists()?d.data():null;},
    async saveDevice(d){await fs.setDoc(fs.doc(db,"devices",d.id),d);},
    async delDevice(id){await fs.deleteDoc(fs.doc(db,"devices",id));},
  };
}

// Estado general de una orden
function orderEstado(o){
  const js=jobsOf(o.id);
  if(!js.length) return "sin_asignar";
  if(js.some(j=>j.estado==="en_curso")) return "activo";
  if(js.every(j=>j.estado==="terminado")) return "terminado";
  if(js.some(j=>j.estado==="pausado")) return "pausado";
  if(js.every(j=>j.estado==="asignado")) return "asignado";
  return "proceso";
}
const ESTADO_LABEL={sin_asignar:"Sin asignar",asignado:"Asignado sin empezar",activo:"Activo (en trabajo)",pausado:"En pausa",terminado:"Terminado",proceso:"En proceso"};
const allDone=o=>{const js=jobsOf(o.id);return js.length>0&&js.every(j=>j.estado==="terminado");};

// Tiempos de pausa por causa (segundos) para un trabajo
function pauseByCause(j){
  const segs=(j.segments||[]); const out={};
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    if(s.reason && s.e){
      let endPause;
      if(i+1<segs.length) endPause=segs[i+1].s;
      else endPause=(j.estado==="terminado"&&j.finishedAt)?j.finishedAt:Date.now();
      const dur=(endPause-s.e)/1000;
      if(dur>0) out[s.reason]=(out[s.reason]||0)+dur;
    }
  }
  return out;
}
function orderPauseByCause(o){const acc={};jobsOf(o.id).forEach(j=>{const m=pauseByCause(j);for(const k in m)acc[k]=(acc[k]||0)+m[k];});return acc;}

function orderInPeriod(o){
  const ref=o.ingresoAt||o.createdAt||Date.now(); const d=new Date(ref); const now=new Date();
  if(dashPeriod==="semana") return ref>=monday(now);
  if(dashPeriod==="mes") return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  if(dashPeriod==="anio") return d.getFullYear()===dashYear;
  return true;
}
function histInPeriod(){
  const now=new Date();
  if(dashPeriod==="semana") return [];
  if(dashPeriod==="mes") return HIST.monthly.filter(r=>r.y===now.getFullYear()&&r.m===now.getMonth());
  if(dashPeriod==="anio") return HIST.monthly.filter(r=>r.y===dashYear);
  return HIST.monthly.slice();
}
function weeksInPeriod(){
  if(dashPeriod==="semana")return 1;
  if(dashPeriod==="mes")return 4.345;
  if(dashPeriod==="anio")return 52;
  const yrs=new Set([...ORDERS.map(o=>new Date(o.ingresoAt||o.createdAt).getFullYear()), ...HIST.monthly.map(r=>r.y)]); return Math.max(1,yrs.size)*52;
}
function metaFactPeriodo(){
  const m=num(SET.metaFacturacionMensual);
  if(dashPeriod==="semana")return m/4.345; if(dashPeriod==="mes")return m; if(dashPeriod==="anio")return m*12;
  const yrs=new Set([...ORDERS.map(o=>new Date(o.ingresoAt||o.createdAt).getFullYear()), ...HIST.monthly.map(r=>r.y)]); return m*12*Math.max(1,yrs.size);
}
function allYears(){return [...new Set([...HIST.monthly.map(r=>r.y), ...ORDERS.map(o=>new Date(o.ingresoAt||o.createdAt).getFullYear())])].sort((a,b)=>b-a);}

function destroyCharts(){ chartInstances.forEach(c=>{try{c.destroy();}catch(e){}}); chartInstances=[]; }

function renderDash(){
  destroyCharts();
  const hist=histInPeriod();
  const tecMode=dashTec!=="all";
  // live: órdenes en periodo (con técnico filtrado)
  let liveOrders=ORDERS.filter(orderInPeriod);
  if(tecMode) liveOrders=liveOrders.filter(o=>jobsOf(o.id).some(j=>j.tecnicoId===dashTec));
  const liveOrdIds=new Set(liveOrders.map(o=>o.id));
  let liveJobs=JOBS.filter(j=>liveOrdIds.has(j.orderId));
  if(tecMode) liveJobs=liveJobs.filter(j=>j.tecnicoId===dashTec);
  const facOrders=liveOrders.filter(o=>o.facturadoAt);
  // MO live (de trabajos facturados)
  const liveMO=liveJobs.filter(j=>{const o=ORDERS.find(x=>x.id===j.orderId);return o&&o.facturadoAt;}).reduce((s,j)=>s+billed(j),0);
  const liveREP=tecMode?0:facOrders.reduce((s,o)=>s+num(o.valorRepuestos),0);
  const liveEXT=tecMode?0:facOrders.reduce((s,o)=>s+num(o.valorServicioExterno),0);
  // histórico (sin técnico)
  const histMO=tecMode?0:hist.reduce((s,r)=>s+r.mo,0);
  const histREP=tecMode?0:hist.reduce((s,r)=>s+r.rep,0);
  const histAutos=tecMode?0:hist.reduce((s,r)=>s+r.autos,0);
  const histTOT=tecMode?0:hist.reduce((s,r)=>s+r.tot,0);
  const histPermW=tecMode?0:hist.reduce((s,r)=>s+r.permDias*r.autos,0);
  // totales
  const MO=histMO+liveMO, REP=histREP+liveREP, EXT=liveEXT;
  const liveAutos=liveOrders.filter(o=>jobsOf(o.id).length>0).length;
  const autos=histAutos+liveAutos;
  const TOT=MO+REP+EXT;
  const ticket=autos?TOT/autos:0;
  const mixMO=TOT?MO/TOT*100:0;
  const liveDelivered=liveOrders.filter(o=>o.salidaAt);
  const livePermW=liveDelivered.reduce((s,o)=>s+(o.salidaAt-o.ingresoAt)/86400000,0);
  const permDias=(autos)?((histPermW+livePermW)/( histAutos + liveDelivered.length || 1)):0;
  // productividad taller (solo live)
  const disp=num(SET.horasDisponibles)*weeksInPeriod()*(tecMode?1:TECHS.filter(t=>t.activo).length||1);
  const realTot=liveJobs.reduce((s,j)=>s+jobReal(j),0);
  const estTot=liveJobs.reduce((s,j)=>s+num(j.horasAsignadas),0);
  const mouTaller=disp?realTot/disp*100:0;
  const eficTaller=realTot>0?estTot/realTot*100:0;
  const prodTaller=mouTaller*eficTaller/100;
  // metas
  const metaFac=metaFactPeriodo(); const facPct=metaFac?Math.min(100,TOT/metaFac*100):0;
  // % HK (hist por año + live)
  let hk=0, totMarca=0; const marcas={}, modelos={};
  function addMarcaSet(setObj,mObj){for(const k in mObj){marcas[k]=(marcas[k]||0)+mObj[k];}}
  if(!tecMode){
    if(dashPeriod==="anio"){ if(HIST.marcasByYear[dashYear])addMarcaSet(0,HIST.marcasByYear[dashYear]); if(HIST.modelosByYear[dashYear])for(const k in HIST.modelosByYear[dashYear])modelos[k]=(modelos[k]||0)+HIST.modelosByYear[dashYear][k]; }
    else if(dashPeriod==="todo"){ for(const y in HIST.marcasByYear)addMarcaSet(0,HIST.marcasByYear[y]); for(const y in HIST.modelosByYear)for(const k in HIST.modelosByYear[y])modelos[k]=(modelos[k]||0)+HIST.modelosByYear[y][k]; }
  }
  liveOrders.forEach(o=>{const m=(o.marca||"—").toUpperCase();marcas[m]=(marcas[m]||0)+1;const md=((o.marca||"")+" "+(o.modelo||"")).trim().toUpperCase()||"—";modelos[md]=(modelos[md]||0)+1;});
  for(const k in marcas){totMarca+=marcas[k];if(k==="HYUNDAI"||k==="KIA")hk+=marcas[k];}
  const pHK=totMarca?hk/totMarca*100:0;
  const marcasArr=Object.entries(marcas).sort((a,b)=>b[1]-a[1]);
  const modelosArr=Object.entries(modelos).sort((a,b)=>b[1]-a[1]).slice(0,8);
  // tipo de servicio
  const tipos=["Express","Mantenimiento","Especializado"]; const tipoCount={Express:0,Mantenimiento:0,Especializado:0};
  if(!tecMode){ if(dashPeriod==="anio"&&HIST.tipoByYear[dashYear]){for(const k in HIST.tipoByYear[dashYear])if(tipoCount[k]!=null)tipoCount[k]+=HIST.tipoByYear[dashYear][k];} else if(dashPeriod==="todo"){for(const y in HIST.tipoByYear)for(const k in HIST.tipoByYear[y])if(tipoCount[k]!=null)tipoCount[k]+=HIST.tipoByYear[y][k];} }
  liveJobs.forEach(j=>{if(tipoCount[j.tipo]!=null)tipoCount[j.tipo]++;});
  // por técnico
  const porTec=TECHS.map(t=>{
    const js=JOBS.filter(j=>{const o=ORDERS.find(x=>x.id===j.orderId);return o&&orderInPeriod(o)&&j.tecnicoId===t.id;});
    const real=js.reduce((s,j)=>s+jobReal(j),0); const est=js.reduce((s,j)=>s+num(j.horasAsignadas),0);
    const mo=js.filter(j=>{const o=ORDERS.find(x=>x.id===j.orderId);return o&&o.facturadoAt;}).reduce((s,j)=>s+billed(j),0);
    const dispT=num(SET.horasDisponibles)*weeksInPeriod();
    const mou=dispT?real/dispT*100:0, ef=real>0?est/real*100:0, prod=mou*ef/100;
    return {nombre:t.nombre,n:js.length,mo,mou,ef,prod};
  }).filter(x=>x.n>0).sort((a,b)=>b.mo-a.mo);
  // tendencia
  let trendLabels=[], trendData=[];
  if(dashPeriod==="todo"){
    const yrs=allYears().sort();
    trendLabels=yrs.map(String);
    trendData=yrs.map(y=>{let v=HIST.monthly.filter(r=>r.y===y).reduce((s,r)=>s+r.tot,0);ORDERS.filter(o=>o.facturadoAt&&new Date(o.ingresoAt).getFullYear()===y).forEach(o=>{v+=jobsOf(o.id).reduce((s,j)=>s+billed(j),0)+num(o.valorRepuestos)+num(o.valorServicioExterno);});return +v.toFixed(0);});
  } else {
    const yr=dashPeriod==="anio"?dashYear:new Date().getFullYear();
    trendLabels=MESES.slice();
    const arr=Array(12).fill(0);
    HIST.monthly.filter(r=>r.y===yr).forEach(r=>arr[r.m]+=r.tot);
    ORDERS.filter(o=>o.facturadoAt&&new Date(o.ingresoAt).getFullYear()===yr).forEach(o=>{arr[new Date(o.ingresoAt).getMonth()]+=jobsOf(o.id).reduce((s,j)=>s+billed(j),0)+num(o.valorRepuestos)+num(o.valorServicioExterno);});
    trendData=arr.map(v=>+v.toFixed(0));
  }
  const years=allYears();
  const tecOpts=`<option value="all">Todo el taller</option>`+TECHS.map(t=>`<option value="${t.id}" ${dashTec===t.id?'selected':''}>${t.nombre}</option>`).join("");

  app.innerHTML=`
  <div class="sectiontitle">
    <h2>Tablero ${tecMode?'· '+(TECHS.find(t=>t.id===dashTec)||{}).nombre:''}</h2>
    <div class="row" style="gap:8px">
      <div class="seg">
        ${[["semana","Semana"],["mes","Mes"],["anio","Año"],["todo","Histórico"]].map(([k,l])=>`<button class="${dashPeriod===k?'on':''}" onclick="setPeriod('${k}')">${l}</button>`).join("")}
      </div>
      ${(dashPeriod==="anio")?`<select class="t" style="width:auto" onchange="setYear(this.value)">${years.map(y=>`<option value="${y}" ${y===dashYear?'selected':''}>${y}</option>`).join("")}</select>`:""}
      <select class="t" style="width:auto" onchange="setDashTec(this.value)">${tecOpts}</select>
    </div>
  </div>
  ${tecMode?'<div class="note" style="margin-top:0;margin-bottom:14px">Vista por técnico: muestra solo datos en vivo de la app (el histórico 2024–2026 no tiene desglose por técnico).</div>':''}

  <div class="kpis">
    <div class="kpi gold"><div class="lbl">Facturación total</div><div class="v">${money(TOT)}</div></div>
    <div class="kpi"><div class="lbl">Mano de obra</div><div class="v">${money(MO)} <small>${mixMO.toFixed(0)}%</small></div></div>
    <div class="kpi"><div class="lbl">Repuestos</div><div class="v">${money(REP)}</div></div>
    <div class="kpi"><div class="lbl">Servicio externo</div><div class="v">${money(EXT)}</div></div>
    <div class="kpi"><div class="lbl">Cantidad de autos</div><div class="v">${autos}</div></div>
    <div class="kpi"><div class="lbl">Ticket promedio</div><div class="v">${money(ticket)}</div></div>
    <div class="kpi"><div class="lbl">Estadía promedio</div><div class="v">${permDias.toFixed(1)} <small>días</small></div></div>
    <div class="kpi gold"><div class="lbl">Productividad taller</div><div class="v">${prodTaller.toFixed(2)}<small>%</small></div></div>
  </div>

      <tr style="border-top:2px solid var(--line)"><td><b>TOTAL TALLER</b></td><td class="n">${liveJobs.length}</td><td class="n"><b>${money(liveMO)}</b></td><td class="n"><b>${mouTaller.toFixed(2)}%</b></td><td class="n"><b>${eficTaller>0?eficTaller.toFixed(2)+"%":"—"}</b></td><td class="n"><b style="color:var(--${prodTaller>=60?'ok':prodTaller>=40?'warn':'danger'})">${prodTaller.toFixed(2)}%</b></td></tr>
    </table></div>
    <div class="note">MOU = horas trabajadas ÷ disponibles × 100. Eficiencia = horas asignadas ÷ reales × 100 (>100% = más rápido que lo asignado). Productividad = MOU × Eficiencia ÷ 100.</div>
  </div>

  <div class="panel pad" style="margin-top:18px">
    <div class="sectiontitle"><h2 style="font-size:17px">Respaldo / Exportar</h2><button class="btn btn-gold" onclick="exportXLSX()">⬇ Descargar Excel (.xlsx)</button></div>
    <p class="muted" style="margin:0;font-size:13px">Descarga el historial en vivo (órdenes, trabajos y resumen por técnico). Se une a tu base por número de OT.</p>
  </div>`;
  drawCharts({trendLabels,trendData,MO,REP,EXT,marcasArr,modelosArr,tipoCount});
}

async function drawCharts(d){
  const Chart=await getChart(); if(!Chart)return;
  const azul="#1D4ED8",oro="#E6B229",ok="#16A34A",grays=["#0E2A66","#1D4ED8","#E6B229","#16A34A","#94A0B8","#D14343","#7C3AED","#0891B2","#B8860B","#475569"];
  const mk=(id,cfg)=>{const el=document.getElementById(id);if(el){chartInstances.push(new Chart(el,cfg));}};
  mk("chTrend",{type:"bar",data:{labels:d.trendLabels,datasets:[{label:"Facturación $",data:d.trendData,backgroundColor:d.trendLabels.map((_,i)=>i===new Date().getMonth()&&dashPeriod!=="todo"?oro:azul),borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>"$"+v.toLocaleString()}}}}});
  mk("chMix",{type:"doughnut",data:{labels:["Mano de obra","Repuestos","Servicio externo"],datasets:[{data:[+d.MO.toFixed(0),+d.REP.toFixed(0),+d.EXT.toFixed(0)],backgroundColor:[azul,oro,ok]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});
  mk("chMarcas",{type:"pie",data:{labels:d.marcasArr.slice(0,7).map(x=>x[0]),datasets:[{data:d.marcasArr.slice(0,7).map(x=>x[1]),backgroundColor:grays}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{boxWidth:11,font:{size:10}}}}}});
  mk("chModelos",{type:"bar",data:{labels:d.modelosArr.map(x=>x[0]),datasets:[{label:"Autos",data:d.modelosArr.map(x=>x[1]),backgroundColor:azul,borderRadius:4}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  mk("chTipo",{type:"doughnut",data:{labels:["Express","Mantenimiento","Especializado"],datasets:[{data:[d.tipoCount.Express,d.tipoCount.Mantenimiento,d.tipoCount.Especializado],backgroundColor:[azul,oro,ok]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});
}

/* ---------- EXPORT XLSX ---------- */
window.exportXLSX=async()=>{
  let XLSX;
  try{ XLSX=await import("https://cdn.sheetjs.com/xlsx-0.20.2/package/xlsx.mjs"); }
  catch(e){ exportCSV(); return; }
  const trabajos=JOBS.map(j=>{const o=ORDERS.find(x=>x.id===j.orderId)||{};const t=TECHS.find(x=>x.id===j.tecnicoId)||{};
    return {OT:o.ot,Placa:o.placa,Marca:o.marca,Modelo:o.modelo,Cliente:o.cliente,Ingreso:o.ingresoAt?new Date(o.ingresoAt).toLocaleString("es-EC"):"",Salida:o.salidaAt?new Date(o.salidaAt).toLocaleString("es-EC"):"",
      Tecnico:t.nombre||"",ManoDeObra:j.moDesc,Tipo:j.tipo,HorasAsignadas:j.horasAsignadas,HorasReales:+jobReal(j).toFixed(2),ValorMO:+billed(j).toFixed(2),Pago30:+jobPay(j).toFixed(2),Estado:labelEstado(j.estado)};});
  const ordenes=ORDERS.map(o=>{const js=jobsOf(o.id);const mo=js.reduce((s,j)=>s+billed(j),0);const tot=mo+num(o.valorRepuestos)+num(o.valorServicioExterno);const perm=o.salidaAt?((o.salidaAt-o.ingresoAt)/86400000):"";
    return {OT:o.ot,Placa:o.placa,Marca:o.marca,Modelo:o.modelo,Cliente:o.cliente,Ingreso:o.ingresoAt?new Date(o.ingresoAt).toLocaleString("es-EC"):"",Salida:o.salidaAt?new Date(o.salidaAt).toLocaleString("es-EC"):"En taller",PermanenciaDias:perm===""?"":+perm.toFixed(2),ManoDeObra:+mo.toFixed(2),Repuestos:num(o.valorRepuestos),ServicioExterno:num(o.valorServicioExterno),TotalOT:+tot.toFixed(2),Facturado:o.facturadoAt?"Sí":"No"};});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(trabajos),"Trabajos");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ordenes),"Ordenes");
  XLSX.writeFile(wb,"productividad_byp_"+new Date().toISOString().slice(0,10)+".xlsx");
};
function exportCSV(){
  const head=["OT","Placa","Marca","Modelo","Cliente","Tecnico","ManoDeObra","Tipo","HAsignadas","HReales","ValorMO","Estado"];
  const rows=JOBS.map(j=>{const o=ORDERS.find(x=>x.id===j.orderId)||{};const t=TECHS.find(x=>x.id===j.tecnicoId)||{};
    return [o.ot,o.placa,o.marca,o.modelo,o.cliente,t.nombre||"",j.moDesc,j.tipo,j.horasAsignadas,jobReal(j).toFixed(2),billed(j).toFixed(2),labelEstado(j.estado)].map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",");});
  const csv="\uFEFF"+[head.join(","),...rows].join("\n");const b=new Blob([csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="productividad_byp.csv";a.click();
}

/* ===================== TICK ===================== */
function tick(){
  if(!session)return;
  document.querySelectorAll(".clk").forEach(el=>{const j=JOBS.find(x=>x.id===el.dataset.id);if(j)el.textContent=fmtClock(jobSecs(j));});
  if(session.role==="tech"){const tech=TECHS.find(t=>t.id===session.techId);if(!tech)return;const a=JOBS.find(j=>j.tecnicoId===tech.id&&j.estado==="en_curso");const lc=$("#liveClock");if(lc)lc.textContent=a?fmtClock(jobSecs(a)):"—";}
}

/* ===================== PIN / MODALES ===================== */
let pinBuf="",pinGoal=null,pinCtx=null;
function buildPinPad(){const pad=$("#pinPad");["1","2","3","4","5","6","7","8","9","←","0","✓"].forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{if(k==="←")pinBuf=pinBuf.slice(0,-1);else if(k==="✓")submitPin();else if(pinBuf.length<4)pinBuf+=k;renderDots();};pad.appendChild(b);});}
function renderDots(){$("#pinDots").textContent=pinBuf.padEnd(4,"·").split("").map((c,i)=>i<pinBuf.length?"●":"·").join("");}
window.askPin=role=>{pinCtx={type:role};pinGoal=role==="coord"?SET.coordPin:SET.tableroPin;$("#pinTitle").textContent=role==="coord"?"PIN coordinador":"PIN tablero";$("#pinSub").textContent="";openPin();};
window.pickTech=()=>{const opts=TECHS.filter(t=>t.activo);modal(`<h2 style="margin:0 0 10px">¿Quién eres?</h2>${opts.map(t=>`<button class="btn btn-line" style="width:100%;margin-bottom:8px;text-align:left" onclick="techPin('${t.id}')">${t.nombre}</button>`).join("")}<button class="btn btn-line" style="width:100%" onclick="closeModal()">Cancelar</button>`);};
window.techPin=id=>{closeModal();const t=TECHS.find(x=>x.id===id);pinCtx={type:"tech",techId:id};pinGoal=t.pin;$("#pinTitle").textContent="PIN de "+t.nombre.split(" ")[0];$("#pinSub").textContent="Ingresa tu PIN";openPin();};
function openPin(){pinBuf="";renderDots();$("#pinModal").classList.add("show");}
window.closePin=()=>$("#pinModal").classList.remove("show");
function submitPin(){if(pinBuf!==pinGoal){$("#pinDots").textContent="✕ incorrecto";pinBuf="";return;}closePin();if(pinCtx.type==="coord")session={role:"coord"};else if(pinCtx.type==="dash")session={role:"dash"};else session={role:"tech",techId:pinCtx.techId};render();}
function modal(html){let g=document.getElementById("genModal");if(!g){g=document.createElement("div");g.className="modal-bg";g.id="genModal";g.innerHTML='<div class="modal" id="genInner"></div>';document.body.appendChild(g);}document.getElementById("genInner").innerHTML=html;g.classList.add("show");}
window.closeModal=()=>{const g=document.getElementById("genModal");if(g)g.classList.remove("show");};
function emptyState(ic,t,s){return `<div class="empty panel"><div class="ic">${ic}</div><h3 style="margin:8px 0 2px">${t}</h3><p class="muted" style="margin:0">${s}</p></div>`;}
</script>
